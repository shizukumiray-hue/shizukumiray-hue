name: Build APK with Downloaded Libbox

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      
      - name: Download libbox.aar from Release
        run: |
          echo "Downloading custom libbox.aar from GitHub Release..."
          curl -L -o app/libs/libbox.aar \
            https://github.com/shizukumiray-hue/shizukumiray-hue/releases/download/libbox-v1.13.19-cc79da2a/libbox.aar
          
          cp app/libs/libbox.aar app/libs/libbox-legacy.aar
          
          ls -lh app/libs/
          echo "libbox.aar downloaded successfully"
      
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleOtherDebug --stacktrace --info 2>&1 | tee build.log
      
      - name: Upload APK if exists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
      
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
