name: Build APK with libbox from source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Android app
      uses: actions/checkout@v4
      path: sing-box-for-android
      
    - name: Checkout sing-box
      uses: actions/checkout@v4
      with:
        repository: SagerNet/sing-box
        ref: v1.14.0-rc.1
        path: sing-box
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install Android NDK
      run: |
        echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
        
    - name: Build libbox.aar
      working-directory: sing-box
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125
        make lib_android
        
    - name: Copy libbox.aar to Android project
      run: |
        mkdir -p sing-box-for-android/app/libs
        find sing-box -name "libbox*.aar" -exec cp {} sing-box-for-android/app/libs/ \;
        ls -lh sing-box-for-android/app/libs/
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      working-directory: sing-box-for-android
      run: chmod +x gradlew
      
    - name: Build APK (Other Debug)
      working-directory: sing-box-for-android
      run: ./gradlew assembleOtherDebug --stacktrace
      
    - name: Build APK (Other Release)
      working-directory: sing-box-for-android
      run: ./gradlew assembleOtherRelease --stacktrace
      continue-on-error: true
      
    - name: List built APKs
      working-directory: sing-box-for-android
      run: find app/build/outputs/apk -name "*.apk" -type f
      
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sing-box-apks
        path: sing-box-for-android/app/build/outputs/apk/**/*.apk
        retention-days: 30
