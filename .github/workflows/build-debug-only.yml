name: Build Debug APK Only

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew assembleOtherDebug --stacktrace --info 2>&1 | tee build.log || true
      
    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: build.log
        
    - name: List output
      run: find app/build -name "*.apk" -o -name "*.log" 2>/dev/null || echo "No APK found"
      
    - name: Upload APK if exists
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: apk-output
        path: |
          app/build/outputs/apk/**/*.apk
          app/build/outputs/logs/*.log
        retention-days: 7
